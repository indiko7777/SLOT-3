<!doctype html><html lang="en"><head><title>Render approved audio</title></head><body><button id="render">Render approved sounds</button><p id="status">Ready</p><textarea id="result" aria-label="Rendered audio manifest"></textarea><script type="module">
import {synthesize,wav} from './synthesis.js';
document.getElementById('render').onclick=async()=>{const status=document.getElementById('status');try{const state=await fetch('/__sound-review/state').then(r=>r.json()),queue=await fetch('./queue.json').then(r=>r.json());const result={},cache={};for(const row of queue){const choice=state.decisions[row.id]?.choice;if(!choice?.startsWith('option-'))continue;const variant=Number(choice.slice(-1)),key=row.profile+'-'+variant;status.textContent='Rendering '+row.title;if(!cache[key]){const buffer=await synthesize(row.profile,variant);const res=await fetch('/__sound-review/upload?name='+key+'.wav',{method:'POST',headers:{'X-Sound-Review':'local','Content-Type':'application/octet-stream'},body:wav(buffer)});if(!res.ok)throw Error(await res.text());cache[key]=(await res.json()).url;}result[row.id]=cache[key];}document.getElementById('result').value=JSON.stringify(result,null,2);status.textContent='Complete';}catch(e){status.textContent='Error: '+e;}};
</script></body></html>
