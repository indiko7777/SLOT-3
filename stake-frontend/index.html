<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no + maximum-scale=1 disables double-tap / pinch zoom on
         mobile; the game frame must never scroll or zoom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Heat Chase: Grand Escape</title>
    <!-- Archivo Narrow ≈ Chalet, the GTA V UI font; used by the DOM overlays
         (game menu etc.) with Arial Narrow as the offline fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050816;
        /* Kill double-tap zoom, pull-to-refresh and scroll chaining. */
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
