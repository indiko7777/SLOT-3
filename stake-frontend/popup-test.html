<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buy Popup Preview</title>
    <style>
      body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; gap:20px;
        background:#0a0613; font-family:Impact, sans-serif; }
      button { padding:18px 26px; font-size:18px; font-family:Impact,sans-serif; letter-spacing:2px;
        text-transform:uppercase; border:2px solid #ff2d95; background:#1a0e33; color:#fff; border-radius:10px; cursor:pointer; }
    </style>
  </head>
  <body>
    <button id="buy">Buy Getaway</button>
    <button id="super">Buy Super Getaway</button>
    <script type="module">
      import { showConfirmPopup } from "/src/confirmPopup.ts";
      const noop = () => {};
      document.getElementById("buy").onclick = () => showConfirmPopup("buy", 1, "USD", noop, 100);
      document.getElementById("super").onclick = () => showConfirmPopup("super_buy", 1, "USD", noop, 500);
    </script>
  </body>
</html>
